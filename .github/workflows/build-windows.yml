name: Build and Release Windows Installer

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package.json
            desktop/package.json

      - name: Install root dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install desktop dependencies
        shell: bash
        working-directory: desktop
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: 冒烟测试：产物能否启动
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "desktop\dist\win-unpacked\Earshot.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "找不到未打包应用：$exe"
            exit 1
          }

          $versionOutput = & $exe --version 2>&1
          $versionExitCode = $LASTEXITCODE
          Write-Host "--version 输出：$versionOutput"
          Write-Host "--version 退出码：$versionExitCode"
          if ($versionExitCode -ne 0 -or ($versionOutput -notmatch '\bv\d+\.\d+\.\d+\b')) {
            Write-Host "stderr 输出："
            & $exe --version 2>&1
            exit 1
          }

          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if (-not $process.HasExited) {
            Write-Host "完整应用在等待期内仍在运行，冒烟测试通过。"
            & taskkill.exe /PID $process.Id /T /F
            exit 0
          }

          Write-Host "完整应用已退出，退出码：$($process.ExitCode)"
          $logPath = Join-Path $env:APPDATA "earshot-desktop\logs\desktop.log"
          Write-Host "日志路径：$logPath"
          if (Test-Path $logPath) {
            Get-Content -Path $logPath
          } else {
            Write-Host "日志文件不存在。"
          }
          exit 1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Earshot-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: false
          body: |
            ## Earshot Windows 安装包

            这是 Earshot 的 Windows 桌面安装包：一个可以听、可以聊的 AI 语音助手。

            ### 安装后怎么用

            双击启动 → 左侧「供应商」填 Key → 点击「测试连接」→ 回到「对话」页开聊。

            ### 系统要求

            Windows 10/11 64 位。

            ### 已知限制

            - 首次启动会慢几秒。
            - 密钥只存本机，不会上传。
