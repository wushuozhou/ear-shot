name: Build and Release Windows Installer

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package.json
            desktop/package.json

      - name: Install root dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install desktop dependencies
        shell: bash
        working-directory: desktop
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist

      - name: 冒烟测试：产物能否启动
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "desktop\dist\win-unpacked\Earshot.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "找不到未打包应用：$exe"
            exit 1
          }

          Remove-Item "$env:APPDATA\earshot-desktop" -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 30
          $alive = -not $p.HasExited
          $logPath = Join-Path $env:APPDATA "earshot-desktop\logs\desktop.log"
          Write-Host "日志路径：$logPath"
          if (Test-Path $logPath) {
            $logContent = Get-Content -Path $logPath -Raw
            Write-Host $logContent
          } else {
            $logContent = ""
            Write-Host "日志文件不存在。"
          }

          $logReady = $logContent.Contains("服务探活成功") -or $logContent.Contains("正在启动服务（端口")
          if (-not $alive -or -not $logReady) {
            Write-Host "冒烟测试失败：进程存活=$alive，日志包含服务启动记录=$logReady"
            if (-not $p.HasExited) {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
            Get-Process Earshot -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Host "冒烟测试通过：应用进程仍在运行且日志包含服务启动记录。"
          Stop-Process -Id $p.Id -Force
          Get-Process Earshot -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Earshot-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: false
          body: |
            ## Earshot Windows 安装包

            这是 Earshot 的 Windows 桌面安装包：一个可以听、可以聊的 AI 语音助手。

            ### 安装后怎么用

            双击启动 → 左侧「供应商」填 Key → 点击「测试连接」→ 回到「对话」页开聊。

            ### 系统要求

            Windows 10/11 64 位。

            ### 已知限制

            - 首次启动会慢几秒。
            - 密钥只存本机，不会上传。
