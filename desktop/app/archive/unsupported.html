<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听屿</title>
<style>
:root{color-scheme:dark;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#e7eeef;background:#070d10}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#16343b66,transparent 65%)}main{max-width:900px;margin:auto;padding:clamp(24px,6vw,76px)}header{display:flex;align-items:center;gap:14px;margin-bottom:40px}header img{width:44px;height:44px}h1{font-size:26px;font-weight:500;margin:0}header button{margin-left:auto;color:#b9d7da;background:#18292f;border:1px solid #32454c;border-radius:22px;padding:10px 18px;cursor:pointer}.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.features button{display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;min-height:82px;padding:18px 22px;background:#122027;border:1px solid #2a3c43;border-radius:14px;color:#e7eeef;cursor:pointer}.features strong{display:block;font-size:18px;font-weight:500;letter-spacing:-.02em}.features small{display:block;margin-top:3px;color:#a5bdc6;font-size:12px}.features button:hover{background:#1d333b;border-color:#7ca6b0}.features button:active{transform:scale(.98)}button:focus-visible{outline:2px solid #a6e5db;outline-offset:3px}.arrow{color:#a6e5db;font-size:24px}footer{margin-top:24px;color:#a5bdc6;font-size:12px}@media(max-width:540px){.features{grid-template-columns:1fr}header{margin-bottom:24px}main{padding:24px 18px}}@media(prefers-contrast:more){button{border-color:#b2c7ce!important}small{color:#d5e3e7!important}}
</style></head><body><main><header><img src="assets/images/tingyu-icon.png" alt=""><h1>听屿</h1><button id="retry" type="button">重试动效</button></header><nav class="features" aria-label="全部功能"></nav><footer role="status">当前设备使用简洁视图</footer></main><script src="assets/data/cms.tingyu.js"></script><script>window.TINGYU_STATIC=true;</script><script src="assets/js/tingyu-bridge.js"></script><script>
const list=document.querySelector('.features');
TINGYU_FEATURES.forEach(feature=>{const button=document.createElement('button');button.type='button';button.setAttribute('aria-label',feature.label);const label=document.createElement('span');const title=document.createElement('strong');title.textContent=feature.title;const chinese=document.createElement('small');chinese.textContent=feature.label;label.append(title,chinese);const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';arrow.setAttribute('aria-hidden','true');button.append(label,arrow);button.addEventListener('click',()=>TingyuArchive.openFeature(feature.id));list.append(button)});
document.querySelector('#retry').addEventListener('click',()=>location.replace('/'));
</script></body></html>
