<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earshot</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div>
          <strong>Earshot</strong>
          <span>听着呢</span>
        </div>
      </div>
      <nav class="nav" aria-label="主导航">
        <a href="#/conversation" data-route="/conversation"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5h14v10H9l-4 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></span>对话</a>
        <a href="#/providers" data-route="/providers"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg></span>供应商</a>
        <a href="#/call" data-route="/call"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 5h10v14H7z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>通话</a>
        <a href="#/settings" data-route="/settings"><span aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="m19 12 2-1-2-3-2 1a7 7 0 0 0-2-1l-.5-2h-3l-.5 2a7 7 0 0 0-2 1L7 8l-2 3 2 1a7 7 0 0 0 0 2l-2 1 2 3 2-1a7 7 0 0 0 2 1l.5 2h3l.5-2a7 7 0 0 0 2-1l2 1 2-3-2-1a7 7 0 0 0 0-2Z"/></svg></span>设置</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="service-indicator"><i id="sidebar-dot"></i><span id="sidebar-status">启动中</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">Earshot</div>
        <div class="topbar-actions">
          <span id="top-status" class="status-pill status-starting">启动中</span>
          <button id="open-logs" class="button button-quiet" type="button">打开日志</button>
        </div>
      </header>
      <div id="notice" class="notice hidden"></div>
      <section id="content" class="content"></section>
    </main>
  </div>
  <script src="./bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
