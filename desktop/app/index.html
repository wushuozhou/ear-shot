<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>听屿</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./chat.css">
  <link rel="stylesheet" href="./experience.css">
  <link rel="stylesheet" href="./workspace.css">
</head>
<body class="immersive-ui">
  <header class="window-bar" aria-label="窗口上栏"><img class="window-brand" src="./brand/tingyu-icon-32.png" alt="听屿"></header>
  <div class="shell">
    <aside class="sidebar">
      <nav class="nav" aria-label="主导航">
        <a href="#/home" data-route="/home" class="nav-card" aria-label="功能"><span class="nav-label">功能</span></a>
        <a href="#/conversation" data-route="/conversation" class="nav-card" aria-label="聊天"><span class="nav-label">聊天</span></a>
        <a href="#/call" data-route="/call" class="nav-card" aria-label="通话"><span class="nav-label">通话</span></a>
        <a href="#/favorites" data-route="/favorites" class="nav-card" aria-label="收藏"><span class="nav-label">收藏</span></a>
        <a href="#/settings" data-route="/settings" class="nav-card" aria-label="设置"><span class="nav-label">设置</span></a>
      </nav>
      <div class="sidebar-bottom"><div class="service-indicator" role="status"><i id="sidebar-dot" aria-hidden="true"></i><span id="sidebar-status">启动中</span></div></div>
    </aside>
    <main class="main">
      <div id="notice" class="notice hidden" role="status"></div>
      <section id="content" class="content"></section>
    </main>
  </div>
  <script src="./bridge.js"></script>
  <script src="./chat-ui.js"></script>
  <script src="./feature-hub-data.js"></script>
  <script src="./feature-hub.js"></script>
  <script src="./workspace-ui.js"></script>
  <script src="./app.js"></script>
</body>
</html>
