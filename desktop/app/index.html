<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earshot</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div>
          <strong>Earshot</strong>
          <span>听着呢</span>
        </div>
      </div>
      <nav class="nav" aria-label="主导航">
        <a href="#/conversation" data-route="/conversation"><span>◌</span>对话</a>
        <a href="#/providers" data-route="/providers"><span>◇</span>供应商</a>
        <a href="#/call" data-route="/call"><span>○</span>通话</a>
        <a href="#/settings" data-route="/settings"><span>□</span>设置</a>
      </nav>
      <div class="sidebar-bottom">
        <div class="service-indicator"><i id="sidebar-dot"></i><span id="sidebar-status">已停止</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">Earshot</div>
        <div class="topbar-actions">
        <span class="service-indicator"><i id="top-dot"></i><span id="top-status">已停止</span></span>
        </div>
      </header>
      <div id="notice" class="notice hidden"></div>
      <section id="content" class="content"></section>
    </main>
  </div>
  <script src="./bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
