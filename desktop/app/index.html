<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earshot</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">E</div>
        <div class="brand-text">
          <strong>Earshot</strong>
          <span>听着呢</span>
        </div>
      </div>
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="收起侧边栏" aria-expanded="true" title="收起侧边栏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg>
      </button>
      <nav class="nav" aria-label="主导航">
        <a href="#/conversation" data-route="/conversation" class="nav-card">
          <span class="nav-card-inner">
            <span class="nav-face nav-front"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5h14v10H9l-4 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></span><span class="nav-label">聊天</span></span>
            <span class="nav-face nav-back" aria-hidden="true">和联系人逐条对话</span>
          </span>
          <span class="nav-tag" aria-hidden="true">语音 · 图片 · 收藏</span>
        </a>
        <a href="#/call" data-route="/call" class="nav-card">
          <span class="nav-card-inner">
            <span class="nav-face nav-front"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg></span><span class="nav-label">通话</span></span>
            <span class="nav-face nav-back" aria-hidden="true">像打电话一样聊天</span>
          </span>
          <span class="nav-tag" aria-hidden="true">拨号 · 通话记录</span>
        </a>
        <a href="#/favorites" data-route="/favorites" class="nav-card">
          <span class="nav-card-inner">
            <span class="nav-face nav-front"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4.5 14.3 9l5 .7-3.6 3.5.9 5-4.6-2.4L7.4 18l.9-5L4.7 9.7l5-.7z"/></svg></span><span class="nav-label">收藏</span></span>
            <span class="nav-face nav-back" aria-hidden="true">收好值得留下的话</span>
          </span>
          <span class="nav-tag" aria-hidden="true">聊天 · 通话</span>
        </a>
        <a href="#/settings" data-route="/settings" class="nav-card">
          <span class="nav-card-inner">
            <span class="nav-face nav-front"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="m19 12 2-1-2-3-2 1a7 7 0 0 0-2-1l-.5-2h-3l-.5 2a7 7 0 0 0-2 1L7 8l-2 3 2 1a7 7 0 0 0 0 2l-2 1 2 3 2-1a7 7 0 0 0 2 1l.5 2h3l.5-2a7 7 0 0 0 2-1l2 1 2-3-2-1a7 7 0 0 0 0-2Z"/></svg></span><span class="nav-label">设置</span></span>
            <span class="nav-face nav-back" aria-hidden="true">供应商 · 外观 · 背景</span>
          </span>
          <span class="nav-tag" aria-hidden="true">语气 · 记忆</span>
        </a>
      </nav>
      <div class="sidebar-bottom">
        <div class="service-indicator"><i id="sidebar-dot"></i><span id="sidebar-status">启动中</span></div>
      </div>
    </aside>
    <main class="main">
      <div id="notice" class="notice hidden"></div>
      <section id="content" class="content"></section>
    </main>
  </div>
  <canvas id="boot-veil" aria-hidden="true"></canvas>
  <script src="./bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
