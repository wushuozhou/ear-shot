<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earshot</title>
<style>
  :root { color-scheme: light; --bg:#f2f2f7; --text:#1c1c1e; --muted:#63636a; --accent:#078442; }
  :root[data-theme="deep-space"],:root[data-theme="contrast"] { color-scheme:dark; --bg:#1c1c1e; --text:#f5f5f7; --muted:#a1a1a8; --accent:#30d158; }
  :root[data-theme="warm-night"] { color-scheme:dark; --bg:#1b1714; --text:#f0e6da; --muted:#a08f7a; --accent:#e0a458; }
  :root[data-theme="contrast"] { --bg:#0a0a0a; --text:#fff; --muted:#c8c8c8; --accent:#ffd400; }
  * { box-sizing:border-box; } html,body { height:100%;margin:0;overflow:hidden; }
  body { background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { height:40px;-webkit-app-region:drag;user-select:none; }
  main { height:calc(100% - 40px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;text-align:center; }
  .activity { width:22px;height:22px;border:2px solid var(--muted);border-right-color:transparent;border-radius:50%;animation:spin 800ms linear infinite; }
  p { color:var(--muted);margin:0; } .error { color:#c73535; } .actions { display:flex;gap:12px; }
  button { min-height:40px;padding:8px 16px;border:0;border-radius:10px;color:var(--bg);background:var(--accent);font:inherit;cursor:pointer; }
  button.secondary { background:transparent;color:var(--accent); } button:focus-visible { outline:2px solid var(--accent);outline-offset:4px; }
  [hidden] { display:none; } @keyframes spin { to { transform:rotate(360deg); } }
  @media(prefers-reduced-motion:reduce) { .activity { animation:none; } }
</style></head>
<body><header aria-label="窗口上栏"></header><main><div class="activity" aria-hidden="true"></div><p id="status" role="status">正在启动…</p><div class="actions" hidden><button id="retry">重试</button><button id="logs" class="secondary">查看日志</button></div></main>
<script>
  const bridge=window.desktop;
  const render=state=>{
    const failed=state.status==='failed';
    document.querySelector('#status').textContent=state.message||'正在启动…';
    document.querySelector('#status').className=failed?'error':'';
    document.querySelector('.activity').hidden=failed;
    document.querySelector('.actions').hidden=!failed;
  };
  document.querySelector('#retry').addEventListener('click',async()=>{
    const button=document.querySelector('#retry');button.disabled=true;
    try { render({message:'正在重新启动…'});await bridge.retry(); }
    catch(error) { render({status:'failed',message:error.message}); }
    finally { button.disabled=false; }
  });
  document.querySelector('#logs').addEventListener('click',()=>bridge.openLogsDir());
  window.__earshotPlayTransition=()=>Promise.resolve();
  bridge?.app?.settings?.get().then(settings=>document.documentElement.dataset.theme=settings.theme).catch(()=>{});
  bridge?.getStatus().then(render).catch(error=>render({status:'failed',message:error.message}));
  bridge?.onState(render);
</script></body></html>
