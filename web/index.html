<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B3654">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>Earshot</title>
</head>
<body data-phase="idle">
  <main id="home">
    <div class="contact">
      <span id="home-avatar" class="avatar preset-1" aria-hidden="true"></span>
      <h1 class="name">Earshot</h1>
      <p id="home-number" class="number">未设置号码</p>
    </div>
    <button id="call" class="call-btn" aria-label="开始通话">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
    </button>
    <button id="open-settings" class="link">通话设置</button>
  </main>

  <section id="incall" aria-live="polite">
    <header>
      <span id="call-avatar" class="avatar preset-1" aria-hidden="true"></span>
      <b class="name">Earshot</b>
      <span id="call-number" class="number"></span>
      <span id="clock">0:00</span>
    </header>
    <canvas id="wave" title="点一下打断"></canvas>
    <p id="status"></p>
    <p id="heard"></p>
    <div id="lines"></div>
    <p id="hint"></p>
    <p id="error" role="alert"></p>
    <button id="grace" hidden>还在吗？点这里继续</button>
    <div id="chat" hidden>
      <textarea id="chat-input" rows="1"></textarea>
      <button id="chat-send">发送</button>
    </div>
    <footer>
      <button id="mute" class="round" aria-label="静音" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
      <button id="keyboard" class="round" aria-label="打字聊天" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 7h18v10H3z"/><path d="M7 11h.01M11 11h.01M15 11h.01M8 14h8"/></svg></button>
      <button id="hangup" class="round end" aria-label="挂断"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1a1 1 0 0 1-.56.9 11 11 0 0 0-2.66 1.85 1 1 0 0 1-1.4 0L.29 13.08a1 1 0 0 1 0-1.41A16.9 16.9 0 0 1 12 7a16.9 16.9 0 0 1 11.71 4.67 1 1 0 0 1 0 1.41l-2.48 2.48a1 1 0 0 1-1.4 0 11 11 0 0 0-2.67-1.85 1 1 0 0 1-.56-.9v-3.1A15 15 0 0 0 12 9z"/></svg></button>
      <span id="timing"></span>
    </footer>
  </section>

  <dialog id="settings">
    <form method="dialog">
      <h2>通话设置</h2>
      <label>访问令牌 <input id="token" type="password" autocomplete="off" placeholder="仅当服务设置了 ACCESS_TOKEN 时填写"></label>
      <label class="row"><input id="dictation" type="checkbox"> 使用浏览器自带听写（Chrome / Edge / Android 免费，中国大陆可能不可用）</label>
      <label class="row"><input id="barge" type="checkbox"> 说话时直接打断（戴耳机效果最好；点波形线也可以打断）</label>
      <menu><button value="ok">保存</button></menu>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
